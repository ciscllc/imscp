name: PHP 8.2 syntax check

on:
  push:
    branches:
      - port/debian12-php82
  pull_request:
    branches:
      - port/debian12-php82
  workflow_dispatch:

jobs:
  php-syntax:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Validate Composer JSON files
        shell: bash
        run: |
          set -euo pipefail
          for file in gui/composer.json gui/composer.lock gui/packages/composer-installers/composer.json; do
            php -r '$data = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); if (!is_array($data)) { throw new RuntimeException("Expected a JSON object"); }' "$file"
            echo "Valid JSON: $file"
          done

      - name: Lint application PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find gui -type d -name vendor -prune -o -type f -name '*.php' -print0)
          printf 'Checking %s PHP files with PHP %s\n' "${#files[@]}" "$(php -r 'echo PHP_VERSION;')"
          for file in "${files[@]}"; do
            php -l "$file" >/dev/null || { echo "Syntax error in: $file"; exit 1; }
          done
