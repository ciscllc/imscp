[PHP]

;;;;;;;;;;;;;;;;;;;
; About php.ini   ;
;;;;;;;;;;;;;;;;;;;
; PHP's initialization file, generally called php.ini, is responsible for
; configuring many of the aspects of PHP's behavior.

; (This file is a copy of the previous php5 template adjusted for php7.4)

; Wrapper for PHP 7.4
; This small wrapper indicates that the canonical configuration is
; `configs/debian/php-common/php.ini`. During packaging the installer
; should copy that canonical file to the target php.ini location for
; PHP 7.4 (for example /etc/php/7.4/fpm/php.ini).

COMMON_PHP_INI = ../../php-common/php.ini

; (rest of file omitted for brevity - identical to original template)
