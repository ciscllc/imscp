; Canonical PHP INI (compact form)
; Source of truth for per-version php.ini templates.
; Installer should copy this file into the appropriate PHP version
; directory (e.g. /etc/php/7.4/fpm/php.ini) when generating packages.

engine = On
short_open_tag = On
precision = 14
output_buffering = 4096
implicit_flush = Off
serialize_precision = 17
allow_call_time_pass_reference = Off
open_basedir = "{HOME_DIR}/:{PEAR_DIR}/:/dev/random:/dev/urandom"
disable_functions = {DISABLE_FUNCTIONS}
variables_order = "GPCS"
request_order = "GP"
register_long_arrays = Off
register_argc_argv = Off
cgi.fix_pathinfo = 1
file_uploads = On
upload_tmp_dir = {TMPDIR}
upload_max_filesize = {UPLOAD_MAX_FILESIZE}M
max_file_uploads = 20
allow_url_fopen = {ALLOW_URL_FOPEN}
max_execution_time = {MAX_EXECUTION_TIME}
max_input_time = {MAX_INPUT_TIME}
memory_limit = {MEMORY_LIMIT}M
post_max_size = {POST_MAX_SIZE}M
error_reporting = {ERROR_REPORTING}
display_errors = {DISPLAY_ERRORS}
log_errors = Off
log_errors_max_len = 1024
ignore_repeated_errors = Off
report_memleaks = On
track_errors = Off
html_errors = Off
date.timezone = {TIMEZONE}
sendmail_path = "/usr/sbin/sendmail -t -i -f webmaster@{EMAIL_DOMAIN}"
session.save_path = {TMPDIR}
session.name = PHPSESSID
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
; End of compact canonical php.ini
